<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Treinamento de spring boot</title>
</head>
<body>
	<div align="center" style="margin-top: 20px;">

		<h2>Informações dos Usuários</h2>
		<a href="/cadastropessoa">Cadastro de Pessoa</a>
		<div th:each="p: ${pessoaobj}">

			<p>
				ID: <span th:text="${p.id}"></span>
			</p>
			<p>
				Nome: <span th:text="${p.nome}"></span>
			</p>
			<p>
				Sobrenome: <span th:text="${p.sobrenome}"></span>
			</p>
			<p>
				Email: <span th:text="${p.email}"></span>
			</p>
			<p>
				Idade: <span th:text="${p.idade}"></span>
			</p>
		</div>

	</div>
	<div align="center" style="margin-top: 20px;">
		<form
			th:action="@{/addfonePessoa/{pessoaid}(pessoaid=${pessoaobj.id})}"
			method="post">
			<table border="1" cellpadding="5">
				<tr>
					<th>Telefone:</th>
					<td><input type="text" name="numero" id="numero" size="45"
						oninput="handlePhone(event)" maxlength="15"
						placeholder="(XX) XXXXX-XXXX"  onsubmit="return validarCampos()? true : false"/></td>
				</tr>
				<tr>
					<th>Tipo:</th>
					<td><input type="text" name="tipo" id="tipo" size="45" /></td>
				</tr>
				<tr>
					<td colspan="2" align="center"><input type="submit"
						value="Cadastrar" />
				</tr>
			</table>
		</form>
	</div>
	<div align="center" style="margin-top: 20px;">
		<table border="1" cellpadding="5">

			<h2>Telefones</h2>

			<tr>
				<th>Número</th>
				<th>Tipo</th>
			</tr>

			<tr th:each="fone : ${telefones}">
				<td th:text="${fone.numero}"></td>
				<td th:text="${fone.tipo}"></td>
				<td><a
					th:href="@{/removertelefone/{idtelefone}(idtelefone=${fone.id})}"
					onclick="return confirm('Tem certeza que deseja excluir ?')">Excluir</a></td>
			</tr>
		</table>
	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
		integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
		crossorigin="anonymous"></script>
		
	<script type="text/javascript">
		
	const handlePhone = (event) => {
        let input = event.target;
        input.value = phoneMask(input.value);
    }

    const phoneMask = (value) => {
        if (!value) return "";

        // Remove tudo que não for dígito
        value = value.replace(/\D/g, "");

        // Define o formato com base no comprimento
        // Se for celular (9 dígitos + DDD), o padrão é (XX) 9XXXX-XXXX
        if (value.length > 10) {
            // Limita a 11 dígitos para o número + 2 para o DDD
            value = value.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
        } else if (value.length > 6) {
            // Se for fixo (8 dígitos + DDD), o padrão é (XX) XXXX-XXXX
            value = value.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
        } else if (value.length > 2) {
            // Apenas DDD e início do prefixo
            value = value.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
        } else {
            // Apenas DDD parcial
            value = value.replace(/^(\d*)/, "($1");
        }

        return value;
    }
    
    function validarCampos() {
    	
    	let numero = document.getElementById('numero').value;
    	let tipo = document.getElementById('tipo').value;
    	
    	if(numero == '') {
    		
    		alert("Número deve ser informado");
    		return false;
    	}
    	else if(tipo == '') {
    		
    		alert("Tipo deve ser informador");
    		return false;
    	}
    	
    	return true;
    }
    	
	</script>
</body>
</html>
